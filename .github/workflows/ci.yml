# Build + ctest core C++ (đủ Redis/Kafka lib) và kiểm Dockerfile build được.
name: ci
# push chỉ main (nhánh khác đã chạy qua pull_request) → mỗi thay đổi chạy một lần, không phải hai.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    services:
      redis:  # cho test gateway_redis (không có thì test tự bỏ qua)
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libhiredis-dev librdkafka-dev
      - run: cmake -S core -B core/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build core/build -j"$(nproc)"
      - run: ctest --test-dir core/build --output-on-failure

  image:
    needs: test  # test đỏ thì không build image; test đã chạy nên image bỏ ctest
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg RUN_TESTS=0 -t ktv-core .
