[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ktv-routing"
version = "0.2.0"
description = "Xếp thứ tự làm việc cho job đã gán sẵn của từng KTV."
requires-python = ">=3.12"
# Lõi routing chỉ dùng thư viện chuẩn.
dependencies = []

[project.optional-dependencies]
# simulator/ và research/ chạy từ source, không nằm trong gói deploy.
simulator = ["pandas>=2.2"]
research = ["numpy>=2.0", "pandas>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ktv_routing*"]
