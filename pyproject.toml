[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ktv-optimizer"
version = "0.1.0"
description = "Offline data foundation for the KTV maintenance optimizer."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

